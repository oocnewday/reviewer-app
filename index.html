<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#22348C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مراجعة OOC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>مراجعة بنك الأسئلة – OOC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2322348C'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23E4EE6A'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2316203A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16203A; --ink-2:#4A5570; --ink-3:#7D879E;
  --paper:#F3F5F9; --surface:#FFFFFF; --line:#D8DEEA; --line-2:#E8ECF3;
  --cobalt:#22348C; --cobalt-2:#E7EAF7;
  --stain:#E4EE6A; --stain-ink:#2F3300;
  --ok:#1D7A52; --ok-2:#E3F2EA;
  --warn:#AE3F28; --warn-2:#F8E7E2;
  --amber:#8A5E00; --amber-2:#FBF1D9;
  --radius:14px; --radius-s:8px;
  --ui:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E6EAF4; --ink-2:#B3BCD2; --ink-3:#8791AA;
    --paper:#0E1426; --surface:#161E35; --line:#2A3553; --line-2:#212B46;
    --cobalt:#8FA2F2; --cobalt-2:#1E2A55;
    --stain:#5B6214; --stain-ink:#F4F8C8;
    --ok:#5CC896; --ok-2:#12352A;
    --warn:#F08F77; --warn-2:#3C1D17;
    --amber:#E6BD5C; --amber-2:#3A2E10;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 140px}
.muted{color:var(--ink-3)}
.small{font-size:.875rem}
.hidden{display:none!important}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:.2px}
.bar .grow{flex:1}
.count{font-weight:600;color:var(--cobalt);white-space:nowrap}
.linkbtn{background:none;border:0;padding:6px 4px;color:var(--cobalt);cursor:pointer;font-weight:500}
.linkbtn.quiet{color:var(--ink-2);font-weight:400}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0E1426}}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){.btn.ok{color:#0E1426}}
.btn.block{width:100%}
a.btn{text-decoration:none}
.btn:disabled{opacity:.55;cursor:default}

/* forms */
label.f{display:block;margin:14px 0 6px;font-weight:600}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.t{min-height:88px;resize:vertical;line-height:1.55}
textarea.t.en{font-family:var(--read);direction:ltr;text-align:left}
.hint{font-size:.85rem;color:var(--ink-3);margin-top:4px}
.err{color:var(--warn);margin-top:10px}

/* auth */
.auth{max-width:420px;margin:8vh auto 0;padding:0 18px}
.auth h1{font-size:1.9rem;line-height:1.25;margin:0 0 6px}
.auth p.lead{color:var(--ink-2);margin:0 0 18px}
.tabs{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);font-weight:600}

/* owner card */
.owner{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.owner h2{font-size:1rem;margin:0 0 8px}
.owner .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 0;border-top:1px solid var(--line-2)}
.owner .row:first-of-type{border-top:0}
.owner .row .grow{flex:1;min-width:180px}
.stat{font-weight:700;font-size:1.15rem}

/* queue */
.qhead{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 10px}
.qhead h2{margin:0;font-size:1.35rem}
.qlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.qlist li+li{border-top:1px solid var(--line-2)}
.qlist a{display:flex;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit}
.qlist a:hover{background:var(--cobalt-2)}
.qid{font-variant-numeric:tabular-nums;font-weight:700;min-width:4.2em}
.qmeta{flex:1;min-width:0}
.qmeta .code{direction:ltr;text-align:right;font-size:.85rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--warn-2);color:var(--warn)}
.tag.amber{background:var(--amber-2);color:var(--amber)}
.tag.cobalt{background:var(--cobalt-2);color:var(--cobalt)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center}

/* question screen */
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:.9rem;margin:2px 0 14px}
.facts b{color:var(--ink);font-weight:600}

.verdict{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.verdict .side{padding:12px 14px;text-align:center}
.verdict .side+.side{border-inline-start:1px solid var(--line)}
.verdict .who{font-size:.85rem;color:var(--ink-2)}
.verdict .letter{font-family:var(--read);font-size:2.6rem;line-height:1.1;font-weight:600;direction:ltr}
.verdict .note{font-size:.8rem;color:var(--ink-3);direction:ltr}
.verdict-foot{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);margin-top:-1px;padding:10px 14px;background:var(--surface)}
.verdict.has-foot{border-radius:var(--radius) var(--radius) 0 0}
.badge{display:inline-block;font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:999px}
.badge.agree{background:var(--ok-2);color:var(--ok)}
.badge.disagree{background:var(--warn-2);color:var(--warn)}
.badge.na{background:var(--line-2);color:var(--ink-2)}
.reason{margin-top:8px;white-space:pre-wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:14px}
.panel h3{margin:0 0 6px;font-size:.95rem}
.panel.warn{border-color:var(--warn);background:var(--warn-2)}
.panel.round2{border-color:var(--cobalt)}
.panel.hand{border-style:dashed}
.pre{white-space:pre-wrap}

.content{direction:ltr;text-align:left;font-family:var(--read);font-size:1.06rem;line-height:1.7}
.content .stem{font-size:1.14rem;font-weight:600;margin:18px 0 8px}
.expl{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:6px 0 4px;color:var(--ink)}
.expl.extra{border-left-color:var(--cobalt)}
.expl .lbl{display:block;font-family:var(--ui);font-size:.78rem;color:var(--ink-3);direction:rtl;text-align:right}
.opts{list-style:none;margin:14px 0 0;padding:0}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--surface)}
.opt.correct{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt .head{display:flex;gap:10px;align-items:baseline}
.opt .key{font-weight:700;min-width:1.4em}
.opt .otext{flex:1;font-weight:600}
.opt .mark{font-family:var(--ui);font-size:.8rem;font-weight:700;color:var(--ok);white-space:nowrap}
.ref{margin-top:14px;font-size:.95rem;color:var(--ink-2)}
.ref .refv{display:block;direction:ltr;text-align:left;font-family:var(--read);color:var(--ink)}

mark.ins{background:var(--stain);color:var(--stain-ink);border-radius:3px;padding:0 1px}
del.rem{color:var(--ink-3);text-decoration-thickness:2px;margin-right:.25em}

details.hist{margin-top:14px}
details.hist summary{cursor:pointer;color:var(--cobalt);font-weight:600;padding:6px 0}
.hitem{border-top:1px solid var(--line-2);padding:10px 0}
.hitem:first-child{border-top:0}

/* sticky actions */
.actions{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actions-in{max-width:720px;margin:0 auto}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{min-height:56px;font-size:1.05rem}
.approve-note{margin-bottom:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px;font-size:1.2rem}
.sheet .foot{display:flex;gap:10px;margin-top:18px}
.sheet .foot .btn{flex:1}

.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cobalt-2);color:var(--cobalt);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw}
.loading{padding:40px 0;text-align:center;color:var(--ink-3)}

/* ===== v2: folders, filters, navigation, sheets, dictation ===== */
.search{display:flex;gap:8px;margin:0 0 12px}
.search input{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-size:.92rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#0E1426}}
.chip .n{display:inline-block;min-width:1.4em;margin-inline-start:6px;padding:0 6px;border-radius:999px;background:var(--line-2);color:var(--ink-2);font-size:.8rem;font-weight:600}
.chip[aria-pressed="true"] .n{background:rgba(255,255,255,.22);color:inherit}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools select{flex:1;min-width:150px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.filters .lbl{font-size:.85rem;color:var(--ink-2);margin:4px 0}
.dot-new{width:8px;height:8px;border-radius:50%;background:var(--cobalt);display:inline-block;margin-inline-end:6px;vertical-align:middle}

.nav{display:flex;align-items:center;gap:4px}
.navbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:40px;font-size:1.2rem;cursor:pointer}
.navbtn:disabled{opacity:.35}
.pos{font-size:.85rem;color:var(--ink-2);white-space:nowrap}

.actions .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.actions .row2.one{grid-template-columns:1fr}
.btn.sec{min-height:44px!important;font-size:.95rem!important;font-weight:600;border-color:var(--cobalt);color:var(--cobalt);background:var(--surface)}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--surface)}
.notebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.notebox textarea{min-height:70px}

.panel.mine{border-color:var(--amber);background:var(--amber-2)}
.audio{width:100%;margin-top:6px}

/* sheet handle + drag */
.sheet{touch-action:pan-y;transition:transform .2s ease}
.sheet.dragging{transition:none}
.grab{display:block;width:100%;border:0;background:none;padding:2px 0 12px;cursor:grab;touch-action:none}
.grab span{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-head{touch-action:none}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types .chip{min-height:40px}
.letters{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.letters button{min-width:52px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;cursor:pointer;font-family:var(--read)}
.letters button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.draft-note{font-size:.8rem;color:var(--ink-3);margin-top:4px}

/* dictation */
.dict{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.mic{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--cobalt);background:var(--cobalt);color:#fff;padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.mic{color:#0E1426}}
.mic.on{background:var(--warn);border-color:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(174,63,40,.45)}70%{box-shadow:0 0 0 12px rgba(174,63,40,0)}100%{box-shadow:0 0 0 0 rgba(174,63,40,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.interim{min-height:1.4em;color:var(--ink-3);font-style:italic;font-size:.92rem;margin-top:4px}
.dict-msg{font-size:.85rem;color:var(--warn);margin-top:4px}
.target-hint{font-size:.8rem;color:var(--ink-3)}
textarea.t.dict-target{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt)}
.install{border:1px solid var(--cobalt);color:var(--cobalt);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600}

.interim:empty,.dict-msg:empty{display:none}
.navbtn span{font-size:1.25rem;line-height:1}
.owner summary::-webkit-details-marker{display:none}

/* ===== v3: reassuring messages, install guide, small/large screens ===== */
.nbox{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);width:min(92vw,560px);z-index:60;
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--ok);background:var(--ok-2);color:var(--ink);
  box-shadow:0 10px 30px rgba(10,15,30,.18);animation:ndrop .28s ease-out;cursor:pointer}
.nbox.err{border-color:var(--warn);background:var(--warn-2)}
.nbox.info{border-color:var(--cobalt);background:var(--cobalt-2)}
.nbox .ic{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font-weight:700;font-size:1.05rem}
.nbox.err .ic{background:var(--warn)} .nbox.info .ic{background:var(--cobalt)}
@media (prefers-color-scheme:dark){.nbox .ic{color:#0E1426}}
.nbox .tt{font-weight:700;line-height:1.45}
.nbox .sb{font-size:.9rem;color:var(--ink-2);margin-top:2px}
.nbox.out{opacity:0;transform:translate(-50%,-8px);transition:opacity .25s,transform .25s}
@keyframes ndrop{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.nbox{animation:none}.nbox.out{transition:none}}

.install-card{display:flex;align-items:center;gap:12px;width:100%;margin-top:22px;padding:12px 14px;border-radius:14px;border:1px dashed var(--cobalt);background:var(--surface);cursor:pointer;text-align:start}
.install-card img{width:44px;height:44px;border-radius:10px;flex:0 0 44px}
.install-card b{display:block}
.install-card span{font-size:.88rem;color:var(--ink-2)}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line-2);padding:4px;border-radius:12px;margin:10px 0 14px}
.ptabs button{border:0;background:none;padding:9px 4px;border-radius:9px;cursor:pointer;font-size:.92rem;min-height:40px}
.ptabs button[aria-selected="true"]{background:var(--surface);font-weight:700;color:var(--cobalt)}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{position:relative;padding:4px 44px 12px 0;counter-increment:st;line-height:1.7}
.steps li::before{content:counter(st);position:absolute;right:0;top:2px;width:30px;height:30px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem}
@media (prefers-color-scheme:dark){.steps li::before{color:#0E1426}}
.k{display:inline-block;direction:ltr;unicode-bidi:isolate;font-family:var(--ui);font-weight:600;font-size:.9rem;padding:1px 8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);white-space:nowrap}
.ar{color:var(--ink-2);font-size:.88rem}
.bgroup{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bgroup.here{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.bgroup h3{margin:0 0 8px;font-size:1rem}
.bgroup .here-tag{font-size:.75rem;font-weight:700;color:var(--cobalt);background:var(--cobalt-2);border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.svgi{display:inline-block;vertical-align:-5px;width:22px;height:22px;color:var(--cobalt)}
.installed{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--ok-2);border:1px solid var(--ok)}

/* small phones */
@media (max-width:380px){
  .wrap{padding-left:12px;padding-right:12px}
  .bar-in{padding-left:12px;padding-right:12px;gap:8px}
  .bar .who{display:none}
  .pos .fl{display:none}
  .actions .btn{font-size:.98rem;padding-left:10px;padding-right:10px}
  .verdict .letter{font-size:2.2rem}
}
/* landscape phones: keep the fixed bar short */
@media (max-height:480px) and (orientation:landscape){
  .actions{padding-top:6px}
  .actions .btn{min-height:44px}
  .actions .row2{margin-top:6px}
}
/* tablets and computers */
@media (min-width:900px){
  .wrap{max-width:780px;padding-top:24px}
  .bar-in,.actions-in{max-width:780px}
  .content{font-size:1.1rem}
}

/* ===== v4: drafts ===== */
.panel.draft{border-color:var(--amber);background:var(--amber-2)}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtns .btn{min-height:46px;font-size:.95rem}
.saved-line{font-size:.82rem;color:var(--ok);margin-top:10px;min-height:1.2em}
.sheet .foot .btn.ok{flex:1.4}
</style>
</head>

/* ---------- word diff (round 2 highlighting) ---------- */
function diffHTML(oldS, newS) {
  oldS = oldS || ''; newS = newS || '';
  if (oldS === newS) return nl(newS);
  const a = oldS.split(/(\s+)/), b = newS.split(/(\s+)/);
  const n = a.length, m = b.length;
  if (n * m > 600000) return `<mark class="ins">${nl(newS)}</mark>`;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  const push = (t, s) => { const last = out[out.length - 1]; if (last && last.t === t) last.s += s; else out.push({ t, s }); };
  while (i < n && j < m) {
    if (a[i] === b[j]) { push('=', b[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { push('-', a[i]); i++; }
    else { push('+', b[j]); j++; }
  }
  while (i < n) push('-', a[i++]);
  while (j < m) push('+', b[j++]);
  return out.map(p => p.t === '=' ? nl(p.s) : p.t === '+' ? (p.s.trim() ? `<mark class="ins">${nl(p.s)}</mark>` : nl(p.s)) : (p.s.trim() ? `<del class="rem">${nl(p.s)}</del>` : '')).join('');
}

/* ---------- drafts: saved on every keystroke (device) + synced to the account (server) ---------- */
// kinds: request (new revision request) · edit_request (changes to my open request) · quick_edit · approve_note
const DRAFT_LABEL = { request: 'طلب تعديل لم يُرسل', edit_request: 'تعديلات على طلبك لم تُحفظ', quick_edit: 'تعديل سريع لم يُحفظ', approve_note: 'ملاحظة للطلاب لم تُنشر' };
const Drafts = {
  cache: {}, timers: {}, listeners: new Set(),
  lsKey() { return `drafts:${S.session?.user?.id}`; },
  k(qid, kind) { return `${qid}:${kind}`; },
  load() { try { this.cache = JSON.parse(localStorage.getItem(this.lsKey()) || '{}'); } catch { this.cache = {}; } },
  persist() { try { localStorage.setItem(this.lsKey(), JSON.stringify(this.cache)); } catch { } },
  get(qid, kind) { const d = this.cache[this.k(qid, kind)]; return d && !d.deleted ? d : null; },
  qids() { const s = new Set(); for (const [k, d] of Object.entries(this.cache)) if (!d.deleted) s.add(Number(k.split(':')[0])); return s; },
  count() { return this.qids().size; },
  notify(state) { this.listeners.forEach(fn => { try { fn(state); } catch { } }); },
  save(qid, kind, payload) {
    const k = this.k(qid, kind);
    this.cache[k] = { payload, updated_at: new Date().toISOString(), synced: false };
    this.persist(); this.notify('local');
    clearTimeout(this.timers[k]); this.timers[k] = setTimeout(() => this.sync(k), 900);
  },
  async sync(k) {
    const d = this.cache[k]; if (!d) return;
    const [qid, kind] = k.split(':');
    try {
      if (d.deleted) {
        const { error } = await sb.from('review_drafts').delete().eq('qid', Number(qid)).eq('kind', kind);
        if (!error) { delete this.cache[k]; this.persist(); }
        return;
      }
      const { error } = await sb.from('review_drafts').upsert({ qid: Number(qid), kind, payload: d.payload, updated_at: d.updated_at }, { onConflict: 'user_id,qid,kind' });
      if (!error && this.cache[k] === d) { d.synced = true; this.persist(); this.notify('synced'); }
    } catch { /* offline: stays unsynced and is retried later */ }
  },
  async clear(qid, kind) {
    const k = this.k(qid, kind);
    clearTimeout(this.timers[k]);
    this.cache[k] = { deleted: true, updated_at: new Date().toISOString() }; this.persist();
    await VoiceStore.del(`${qid}:${kind}`).catch(() => { });
    this.sync(k);
  },
  async pull() {
    // merge the account copy with this device: the newer one wins; flush anything this device could not send yet
    let rows = [];
    try { const { data, error } = await sb.from('review_drafts').select('qid,kind,payload,updated_at'); if (!error) rows = data || []; else return; } catch { return; }
    const onServer = new Set();
    for (const r of rows) {
      const k = this.k(r.qid, r.kind); onServer.add(k);
      const loc = this.cache[k];
      if (!loc || (!loc.deleted && new Date(r.updated_at) > new Date(loc.updated_at))) this.cache[k] = { payload: r.payload, updated_at: r.updated_at, synced: true };
    }
    for (const [k, d] of Object.entries(this.cache)) {
      if (d.deleted || !d.synced) this.sync(k);
      else if (!onServer.has(k)) delete this.cache[k];            // finished on another device
    }
    this.persist();
  },
  flush() { for (const [k, d] of Object.entries(this.cache)) if (d.deleted || !d.synced) { clearTimeout(this.timers[k]); this.sync(k); } },
};

/* voice recordings of unsent requests are kept on the device (IndexedDB) */
const VoiceStore = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('ooc-review', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('voice');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  key(k) { return `${S.session?.user?.id}:${k}`; },
  async put(k, blob, mime) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('voice', 'readwrite'); t.objectStore('voice').put({ blob, mime, at: Date.now() }, this.key(k)); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('voice').objectStore('voice').get(this.key(k)); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res) => { const t = db.transaction('voice', 'readwrite'); t.objectStore('voice').delete(this.key(k)); t.oncomplete = res; t.onerror = res; }); },
};

/* resume: the app reopens where the reviewer left it (question + open window) */

  key() { return `resume:${S.session?.user?.id}`; },
  state: { hash: '', sheet: null, ts: 0 },
  read() { try { return JSON.parse(localStorage.getItem(this.key()) || 'null'); } catch { return null; } },
  save(patch) { if (!S.session) return; Object.assign(this.state, patch || {}, { hash: location.hash, ts: Date.now() }); try { localStorage.setItem(this.key(), JSON.stringify(this.state)); } catch { } },
};

const CONF_RANK = { low: 0, medium: 1, high: 2 };

function loadView() {

  return { folder: 'todo', sort: 'priority', conf: 'all', disagree: false, incomplete: false, showFilters: false, ...v };

function saveView() { try { localStorage.setItem(VIEW_KEY(), JSON.stringify(S.view)); } catch { } }
function listFor(view = S.view) {
  const f = FOLDERS.find(x => x.id === view.folder) || FOLDERS[0];
  let rows = S.rows.filter(f.test);
  if (view.conf !== 'all') rows = rows.filter(r => r.ai_confidence === view.conf);
  if (view.disagree) rows = rows.filter(r => r.match_status === 'disagree');
  if (view.incomplete) rows = rows.filter(r => r.is_incomplete);
  const cr = r => CONF_RANK[r.ai_confidence] ?? 1;
  const by = {
    priority: (a, b) => a.priority - b.priority || a.qid - b.qid,
    id_asc: (a, b) => a.qid - b.qid, id_desc: (a, b) => b.qid - a.qid,
    conf_low: (a, b) => cr(a) - cr(b) || a.qid - b.qid, conf_high: (a, b) => cr(b) - cr(a) || a.qid - b.qid,
  }[view.sort] || ((a, b) => a.qid - b.qid);
  return rows.sort(by);
}
async function loadQueue() {

function reasonTags(r, showStatus) {
  const t = [];
  if (showStatus) t.push(`<span class="tag cobalt">${esc(STATUS_AR[r.status] || r.status)}</span>`);
  if (r.match_status === 'disagree') t.push('<span class="tag warn">مختلف مع المصدر</span>');
  if (r.ai_confidence) t.push(`<span class="tag ${r.ai_confidence === 'low' ? 'amber' : ''}">ثقة ${CONF[r.ai_confidence] || r.ai_confidence}</span>`);
  if (r.is_incomplete) t.push('<span class="tag amber">ناقص في المصدر</span>');
  if (r.status === 'revised') t.push(`<span class="tag cobalt">جولة ${(r.rounds || 1) + 1}</span>`);
  if (Drafts.qids().has(r.qid)) t.push('<span class="tag amber">📝 مسودة لم تُرسل</span>');
  if (r.my_open_request_id) t.push('<span class="tag amber">طلبك مفتوح</span>');
  else if (r.open_requests) t.push('<span class="tag amber">طلب من مراجع آخر</span>');
  return t.join('');
}

/* ---------- question ---------- */
async function openQuestion(qid) {
  stopSolverTimer(); closeSheets();
  if (!S.rows.length && !S.notices.length) await loadQueue();
  if (!S.bundle || S.qid !== qid) $app.innerHTML = '<div class="loading">جاري تحميل السؤال…</div>';
  const b = await rpc('question_bundle', { p_qid: qid });
  if (!b) throw new Error('هذا السؤال غير متاح لك.');
  S.bundle = b; S.qid = qid; S.showExtra = false;
  const nd = Drafts.get(qid, 'approve_note'); S.noteDraft = nd?.payload?.note || ''; S.noteOpen = !!nd;
  renderQuestion(); scrollTo(0, 0);
  rpc('mark_seen', { p_qid: qid }).then(() => { const r = S.rows.find(x => x.qid === qid); if (r) r.seen = true; }).catch(() => { });
  if (S.pendingSheet) {
    // the app was closed while this window was open: reopen it with everything that was typed or recorded
    const k = S.pendingSheet; S.pendingSheet = null;
    const myReq = (b.reviews || []).find(r => r.status === 'open' && r.reviewer_id === S.session.user.id);
    let opened = true;
    if (k === 'quick_edit' && Drafts.get(qid, k)) openQuickEdit();
    else if (k === 'edit_request' && myReq && Drafts.get(qid, k)) await openRevision({ edit: myReq });
    else if (k === 'request' && Drafts.get(qid, k)) await openRevision();
    else opened = false;
    notify('رجّعتك للمكان اللي كنت فيه', opened ? 'واللي كتبته محفوظ، ومستني تأكيدك أو إلغاءك.' : '', 'info');
    return;
  }
  await showBeforeFirst(qid);
}
function navInfo() {
  // navigate inside the current folder; if the question is not in it (opened by number or link), use its own folder
  let folder = S.view.folder, list = listFor(), i = list.findIndex(r => r.qid === S.qid);
  const row = S.rows.find(r => r.qid === S.qid);
  if (i < 0 && row) {
    const f = FOLDERS.slice(1).find(x => x.id !== 'all' && x.test(row)) || FOLDERS.find(x => x.id === 'all');
    folder = f.id; list = listFor({ ...S.view, folder, conf: 'all', disagree: false, incomplete: false }); i = list.findIndex(r => r.qid === S.qid);
  }
  return { list, i, folder, prev: i > 0 ? list[i - 1] : null, next: i >= 0 && i < list.length - 1 ? list[i + 1] : null };
}
function go(r) {
  if (!r) return;

/* ---------- revision request sheet (new or edit) – autosaved draft, explicit confirm / cancel ---------- */
async function openRevision(pre = {}) {
  const b = S.bundle, q = b.question, v = b.current_version || {};
  const types = b.revision_types || [];
  const edit = pre.edit || null;
  const kind = edit ? 'edit_request' : 'request';
  const letters = (v.options || []).map(o => o.key);
  const fromReq = r => ({ type: r.revision_type || '', comment: [r.comment_internal, r.voice_transcript].filter(Boolean).join('\n').replace(/الإجابة الصحيحة:\s*[A-Z]\s*\n?/, '').trim(), student: r.student_note || '', answer: (r.comment_internal || '').match(/الإجابة الصحيحة:\s*([A-Z])/)?.[1] || '', keepVoice: r.voice_path || null, reviewId: r.id });
  const saved = Drafts.get(q.qid, kind);
  const base = edit ? fromReq(edit) : { type: pre.type || '', comment: pre.comment || '', student: '', answer: '', keepVoice: null };
  const st = { ...base, ...(saved?.payload || {}) };
  V.blob = null; V.chunks = [];
  if (st.hasVoice) { try { const vv = await VoiceStore.get(`${q.qid}:${kind}`); if (vv) { V.blob = vv.blob; V.mime = vv.mime; } } catch { } }
  const canRec = !!(navigator.mediaDevices && window.MediaRecorder);
  let decided = false;
  Resume.save({ sheet: kind });
  const { sheet, close } = openSheet(`
    <div class="sheet-head"><h2>${edit ? 'تعديل طلبك على السؤال' : 'طلب تعديل للسؤال'} ${esc(q.qid_display)}</h2>
    ${saved ? `<div class="draft-note">رجّعتلك اللي كنت كاتبه (آخر حفظ: ${esc(draftAge(saved))}).</div>` : ''}</div>
    <label class="f">نوع التعديل</label>
    <div class="types" id="rv-types">${types.map(t => `<button type="button" class="chip" data-type="${esc(t.value)}" aria-pressed="${st.type === t.value}">${esc(t.label)}</button>`).join('')}</div>
    <div id="rv-letters" class="${st.type === 'change_answer' ? '' : 'hidden'}"><label class="f">الإجابة الصحيحة في رأيك</label>
      <div class="letters">${letters.map(k => `<button type="button" data-letter="${esc(k)}" aria-pressed="${st.answer === k}">${esc(k)}</button>`).join('')}</div></div>
    <label class="f" for="rv-comment">ملاحظتك للفريق (اكتب أو اتكلم)</label>

    <div class="dict" id="rv-dict"></div>
    <label class="f" for="rv-student">ملاحظة للطلاب (اختيارية)</label>
    <textarea class="t" id="rv-student" dir="auto" rows="2" placeholder="تظهر في التطبيق فقط لو كتبتها">${esc(st.student)}</textarea>
    <p class="target-hint" style="margin:4px 0 0">زر "اتكلم" بيكتب في آخر خانة ضغطت عليها.</p>

    ${st.keepVoice ? `<div id="old-voice"><audio class="audio" controls preload="none" data-voice="${esc(st.keepVoice)}"></audio><button class="linkbtn quiet small" type="button" id="old-voice-del">احذف التسجيل القديم</button></div>` : ''}
    ${canRec ? `<div class="rec"><button class="btn" id="rec-btn" type="button">● ${V.blob ? 'سجّل من جديد' : 'سجّل فويس'}</button><span id="rec-state" class="small muted" aria-live="polite">${V.blob ? 'تسجيلك محفوظ على الجهاز.' : ''}</span></div>
      <audio id="rec-play" controls class="${V.blob ? '' : 'hidden'} audio"></audio><button class="linkbtn quiet small ${V.blob ? '' : 'hidden'}" id="rec-del" type="button">احذف التسجيل</button>` : '<p class="hint">التسجيل غير مدعوم في هذا المتصفح.</p>'}

  `, {
    onClose: () => {
      stopRec(); unlisten();

        Resume.save({ sheet: null });
        if (Drafts.get(q.qid, kind)) { notify('المسودة محفوظة', `تقدر تكمّلها أو تلغيها من السؤال رقم ${q.qid_display} في أي وقت.`, 'info'); if (S.qid === q.qid) renderQuestion(); }
      }
    },
  });
  const $ = s => sheet.querySelector(s);
  const unlisten = savedLine($('#rv-saved'));
  if (V.blob) { $('#rec-play').src = URL.createObjectURL(V.blob); }
  const isEmpty = () => !st.type && !$('#rv-comment').value.trim() && !$('#rv-student').value.trim() && !V.blob && !st.answer;
  const unchanged = () => edit && st.type === base.type && $('#rv-comment').value.trim() === base.comment && $('#rv-student').value.trim() === base.student && st.answer === base.answer && !V.blob && st.keepVoice === base.keepVoice;
  const persist = () => {

    Drafts.save(q.qid, kind, { type: st.type, answer: st.answer, comment: $('#rv-comment').value, student: $('#rv-student').value, keepVoice: st.keepVoice, hasVoice: !!V.blob, reviewId: edit?.id || null });
  };
  let lastFocus = $('#rv-comment');
  ['#rv-comment', '#rv-student'].forEach(s => { const t = $(s); t.addEventListener('focus', () => { lastFocus = t; if (D.active) { const ui = D.ui; stopDictation(); startDictation(ui, t); } }); t.addEventListener('input', persist); });
  mountDictation($('#rv-dict'), () => lastFocus, 'ar-EG');
  sheet.querySelectorAll('[data-type]').forEach(bt => bt.onclick = () => {
    st.type = st.type === bt.dataset.type ? '' : bt.dataset.type;
    sheet.querySelectorAll('[data-type]').forEach(x => x.setAttribute('aria-pressed', x.dataset.type === st.type));
    $('#rv-letters').classList.toggle('hidden', st.type !== 'change_answer'); persist();
  });
  sheet.querySelectorAll('[data-letter]').forEach(bt => bt.onclick = () => {
    st.answer = bt.dataset.letter; sheet.querySelectorAll('[data-letter]').forEach(x => x.setAttribute('aria-pressed', x === bt)); persist();
  });
  const rb = $('#rec-btn'); if (rb) rb.onclick = () => V.on ? stopRec() : startRec(sheet, blob => { VoiceStore.put(`${q.qid}:${kind}`, blob, V.mime).catch(() => { }); persist(); });
  const rd = $('#rec-del'); if (rd) rd.onclick = () => { V.blob = null; VoiceStore.del(`${q.qid}:${kind}`).catch(() => { }); $('#rec-play').classList.add('hidden'); rd.classList.add('hidden'); $('#rec-state').textContent = ''; persist(); };
  const od = $('#old-voice-del'); if (od) od.onclick = () => { st.keepVoice = null; $('#old-voice').remove(); persist(); };
  sheet.querySelectorAll('audio[data-voice]').forEach(a => signed('voice-notes', a.dataset.voice).then(u => { if (u) a.src = u; }));
  if (!edit && pre.comment && !saved) { const t = $('#rv-comment'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }

  $('#rv-discard').onclick = async () => {
    if (!isEmpty() && !unchanged() && !confirm(edit ? 'تجاهل كل التعديلات اللي عملتها على طلبك؟ طلبك الأصلي هيفضل زي ما هو.' : 'إلغاء الطلب ومسح كل اللي كتبته أو سجلته فيه؟')) return;
    decided = true; stopRec(); stopDictation();
    await Drafts.clear(q.qid, kind); V.blob = null;
    Resume.save({ sheet: null }); close(true);
    notify(edit ? 'تم تجاهل التعديلات' : 'تم إلغاء الطلب', edit ? 'طلبك الأصلي زي ما هو.' : 'واتمسحت المسودة بتاعته.', 'info');
    if (S.qid === q.qid) renderQuestion();
  };
  $('#rv-send').onclick = async () => {
    const btn = $('#rv-send'), err = $('#rv-err');
    stopDictation(); if (V.on) stopRec();
    let comment = $('#rv-comment').value.trim();
    const student = $('#rv-student').value.trim() || null;
    if (st.type === 'change_answer') {
      if (!st.answer) { err.textContent = 'اختار الإجابة الصحيحة في رأيك (الحروف فوق).'; return; }

    }
    if (!st.type && !comment) { err.textContent = V.blob ? 'Claude بيقرا النص بس: اكتب المطلوب أو اختار نوع التعديل.' : 'اختار نوع التعديل أو اكتب ملاحظتك.'; return; }
    btn.disabled = true; err.textContent = '';
    try {
      let path = st.keepVoice;
      if (V.blob) {
        btn.textContent = 'جاري رفع الفويس…';
        const ext = (V.mime || '').includes('mp4') ? 'm4a' : (V.mime || '').includes('ogg') ? 'ogg' : 'webm';
        path = `${S.session.user.id}/${q.qid_display}_${Date.now()}.${ext}`;
        const { error } = await sb.storage.from('voice-notes').upload(path, V.blob, { contentType: (V.mime || 'audio/webm').split(';')[0], upsert: false });
        if (error) throw error;
      }
      if (edit) {
        await rpc('update_my_request', { p_review_id: edit.id, p_revision_type: st.type || null, p_comment: comment || null, p_student_note: student, p_voice_path: path, p_voice_transcript: null });
      } else {
        await rpc('submit_review', { p_qid: q.qid, p_decision: 'needs_revision', p_revision_type: st.type || null, p_comment: comment || null, p_student_note: student, p_voice_path: path, p_voice_transcript: null });
      }
      decided = true; V.blob = null;
      await Drafts.clear(q.qid, kind); Resume.save({ sheet: null }); close(true);
      if (edit) { notify(`تم حفظ التعديل على طلبك للسؤال رقم ${q.qid_display} بفضل الله`); await refreshCurrent(); }
      else await afterDecision(q.qid, `تم إرسال طلب التعديل للسؤال رقم ${q.qid_display} بفضل الله`, 'هيرجعلك في فولدر "عدّلها Claude" بعد التنفيذ.');
    } catch (e) {
      btn.disabled = false; btn.textContent = `✓ ${edit ? 'تأكيد حفظ التعديل على طلبك' : 'تأكيد وإرسال الطلب'}`;
      err.textContent = errText(e) + ' — مسودتك محفوظة، جرّب تاني.';
    }
  };
}

/* ---------- quick edit (access 3) – autosaved draft, explicit confirm / cancel ---------- */
function openQuickEdit() {
  const q = S.bundle.question, v = S.bundle.current_version;
  const saved = Drafts.get(q.qid, 'quick_edit');
  const ta = (id, val, cls = 'en', rows = 3) => `<textarea class="t ${cls}" id="${id}" rows="${rows}">${esc(val || '')}</textarea>`;

    <p class="hint">للتعديلات البسيطة فقط. الإجابة الصحيحة لا تتغير من هنا؛ لتغييرها اطلب تعديلًا بنوع "تغيير الإجابة". زر "اتكلم" يكتب في آخر خانة ضغطت عليها.</p></div>

      <label class="f" for="qe-o${i}-e">الشرح</label>${ta(`qe-o${i}-e`, o.explanation)}
      <label class="f" for="qe-o${i}-x">مزيد من الشرح (اختياري)</label>${ta(`qe-o${i}-x`, o.explanation_extra)}
    </fieldset>`).join('')}
    <label class="f" for="qe-ref">تفاصيل المرجع</label><input class="t" id="qe-ref" dir="ltr" value="${esc(v.reference_detail || '')}">
    <label class="f" for="qe-note">ملاحظة للطلاب</label>${ta('qe-note', v.student_note, '', 2)}
    <label class="f" for="qe-why">سبب التعديل (مطلوب)</label><input class="t" id="qe-why" dir="auto">
    <div class="saved-line" id="qe-saved" aria-live="polite">${saved ? `✓ محفوظ (${esc(draftAge(saved))})` : 'تعديلاتك بتتحفظ تلقائيًا لحظة بلحظة لحد ما تأكدها أو تلغيها.'}</div>
    <div class="err" id="qe-err" role="alert"></div>
    <div class="foot"><button class="btn ok" id="qe-save">✓ تأكيد حفظ التعديل</button><button class="btn warn" id="qe-cancel" type="button">✕ إلغاء التعديل</button></div>
  `, {
    onClose: () => {
      unlisten();
      if (!decided) { Resume.save({ sheet: null }); if (Drafts.get(q.qid, 'quick_edit')) { notify('تعديلاتك محفوظة', `تقدر تكمّلها أو تلغيها من السؤال رقم ${q.qid_display}.`, 'info'); if (S.qid === q.qid) renderQuestion(); } }
    },
  });
  const $ = s => sheet.querySelector(s);
  const fields = [...sheet.querySelectorAll('textarea,input')];
  const initial = Object.fromEntries(fields.map(x => [x.id, x.value]));
  if (saved?.payload?.fields) for (const [id, val] of Object.entries(saved.payload.fields)) { const el = $('#' + id); if (el) el.value = val; }
  const dirty = () => fields.some(x => x.value !== initial[x.id]);
  const unlisten = savedLine($('#qe-saved'));
  const persist = () => { if (!dirty()) { if (Drafts.get(q.qid, 'quick_edit')) Drafts.clear(q.qid, 'quick_edit'); return; } Drafts.save(q.qid, 'quick_edit', { fields: Object.fromEntries(fields.filter(x => x.value !== initial[x.id]).map(x => [x.id, x.value])) }); };
  fields.forEach(x => x.addEventListener('input', persist));
  let lastFocus = $('#qe-stem');
  sheet.querySelectorAll('textarea').forEach(t => t.addEventListener('focus', () => { lastFocus = t; if (D.active) { const ui = D.ui; stopDictation(); startDictation(ui, t); } }));
  mountDictation($('#qe-dict'), () => lastFocus, 'en-US');
  $('#qe-cancel').onclick = async () => {
    if (dirty() && !confirm('إلغاء كل التعديلات اللي عملتها هنا؟ السؤال هيفضل زي ما هو.')) return;
    decided = true; await Drafts.clear(q.qid, 'quick_edit'); Resume.save({ sheet: null }); close(true);
    notify('تم إلغاء التعديل', 'السؤال زي ما هو، واتمسحت المسودة.', 'info'); if (S.qid === q.qid) renderQuestion();
  };
  $('#qe-save').onclick = async () => {
    const g = id => $('#' + id).value, norm = s => (s || '').trim(), err = $('#qe-err');
    const why = norm(g('qe-why')); if (!why) { err.textContent = 'اكتب سبب التعديل.'; $('#qe-why').focus(); return; }
    const ch = {};
    if (norm(g('qe-stem')) !== norm(v.stem)) ch.stem = norm(g('qe-stem'));
    if (norm(g('qe-main')) !== norm(v.explanation_main)) ch.explanation_main = norm(g('qe-main')) || null;
    if (norm(g('qe-extra')) !== norm(v.explanation_extra)) ch.explanation_extra = norm(g('qe-extra')) || null;
    if (norm(g('qe-ref')) !== norm(v.reference_detail)) ch.reference_detail = norm(g('qe-ref')) || null;
    if (norm(g('qe-note')) !== norm(v.student_note)) ch.student_note = norm(g('qe-note')) || null;
    let optChanged = false;
    const opts = (v.options || []).map((o, i) => {
      const n = { ...o, text: norm(g(`qe-o${i}-t`)), explanation: norm(g(`qe-o${i}-e`)) };
      const x = norm(g(`qe-o${i}-x`)); if (x) n.explanation_extra = x; else delete n.explanation_extra;
      if (n.text !== norm(o.text) || n.explanation !== norm(o.explanation) || (n.explanation_extra || '') !== norm(o.explanation_extra)) optChanged = true;
      return n;
    });
    if (optChanged) ch.options = opts;
    if (!Object.keys(ch).length) { err.textContent = 'لم يتغير شيء في السؤال.'; return; }
    const btn = $('#qe-save'); btn.disabled = true;
    try {
      await rpc('quick_edit', { p_qid: q.qid, p_changes: ch, p_note: why });
      decided = true; await Drafts.clear(q.qid, 'quick_edit'); Resume.save({ sheet: null }); close(true);
      notify(`تم حفظ التعديل السريع للسؤال رقم ${q.qid_display} بفضل الله`, 'السؤال في فولدر "تنتظرك" لحد ما يتعتمد.'); await refreshCurrent();
    } catch (e) { btn.disabled = false; err.textContent = errText(e) + ' — تعديلاتك محفوظة، جرّب تاني.'; }
  };
}

    const uid = session?.user?.id || null;
    if (event === 'SIGNED_IN' && uid && uid === currentUser) { S.session = session; return; } // token refresh / tab focus
    const fresh = event === 'SIGNED_IN' && !currentUser;
    currentUser = uid;
    setTimeout(async () => { await onSession(session); if (fresh && S.profile?.is_active) notify(`أهلًا بيك يا ${S.profile.display_name || 'دكتور'}`, S.queue.length ? `في ${S.queue.length} سؤال مستنيين مراجعتك.` : 'مفيش أسئلة مستنياك دلوقتي.', 'info'); }, 0);
  }
  if (event === 'TOKEN_REFRESHED') S.session = session;
});
</script>
