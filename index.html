<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#22348C">
<title>مراجعة بنك الأسئلة – OOC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2322348C'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23E4EE6A'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2316203A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16203A; --ink-2:#4A5570; --ink-3:#7D879E;
  --paper:#F3F5F9; --surface:#FFFFFF; --line:#D8DEEA; --line-2:#E8ECF3;
  --cobalt:#22348C; --cobalt-2:#E7EAF7;
  --stain:#E4EE6A; --stain-ink:#2F3300;
  --ok:#1D7A52; --ok-2:#E3F2EA;
  --warn:#AE3F28; --warn-2:#F8E7E2;
  --amber:#8A5E00; --amber-2:#FBF1D9;
  --radius:14px; --radius-s:8px;
  --ui:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --read:"Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E6EAF4; --ink-2:#B3BCD2; --ink-3:#8791AA;
    --paper:#0E1426; --surface:#161E35; --line:#2A3553; --line-2:#212B46;
    --cobalt:#8FA2F2; --cobalt-2:#1E2A55;
    --stain:#5B6214; --stain-ink:#F4F8C8;
    --ok:#5CC896; --ok-2:#12352A;
    --warn:#F08F77; --warn-2:#3C1D17;
    --amber:#E6BD5C; --amber-2:#3A2E10;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 140px}
.muted{color:var(--ink-3)}
.small{font-size:.875rem}
.hidden{display:none!important}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:.2px}
.bar .grow{flex:1}
.count{font-weight:600;color:var(--cobalt);white-space:nowrap}
.linkbtn{background:none;border:0;padding:6px 4px;color:var(--cobalt);cursor:pointer;font-weight:500}
.linkbtn.quiet{color:var(--ink-2);font-weight:400}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0E1426}}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){.btn.ok{color:#0E1426}}
.btn.block{width:100%}
a.btn{text-decoration:none}
.btn:disabled{opacity:.55;cursor:default}

/* forms */
label.f{display:block;margin:14px 0 6px;font-weight:600}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.t{min-height:88px;resize:vertical;line-height:1.55}
textarea.t.en{font-family:var(--read);direction:ltr;text-align:left}
.hint{font-size:.85rem;color:var(--ink-3);margin-top:4px}
.err{color:var(--warn);margin-top:10px}

/* auth */
.auth{max-width:420px;margin:8vh auto 0;padding:0 18px}
.auth h1{font-size:1.9rem;line-height:1.25;margin:0 0 6px}
.auth p.lead{color:var(--ink-2);margin:0 0 18px}
.tabs{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);font-weight:600}

/* owner card */
.owner{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.owner h2{font-size:1rem;margin:0 0 8px}
.owner .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 0;border-top:1px solid var(--line-2)}
.owner .row:first-of-type{border-top:0}
.owner .row .grow{flex:1;min-width:180px}
.stat{font-weight:700;font-size:1.15rem}

/* queue */
.qhead{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 10px}
.qhead h2{margin:0;font-size:1.35rem}
.qlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.qlist li+li{border-top:1px solid var(--line-2)}
.qlist a{display:flex;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit}
.qlist a:hover{background:var(--cobalt-2)}
.qid{font-variant-numeric:tabular-nums;font-weight:700;min-width:4.2em}
.qmeta{flex:1;min-width:0}
.qmeta .code{direction:ltr;text-align:right;font-size:.85rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--warn-2);color:var(--warn)}
.tag.amber{background:var(--amber-2);color:var(--amber)}
.tag.cobalt{background:var(--cobalt-2);color:var(--cobalt)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center}

/* question screen */
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:.9rem;margin:2px 0 14px}
.facts b{color:var(--ink);font-weight:600}

.verdict{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.verdict .side{padding:12px 14px;text-align:center}
.verdict .side+.side{border-inline-start:1px solid var(--line)}
.verdict .who{font-size:.85rem;color:var(--ink-2)}
.verdict .letter{font-family:var(--read);font-size:2.6rem;line-height:1.1;font-weight:600;direction:ltr}
.verdict .note{font-size:.8rem;color:var(--ink-3);direction:ltr}
.verdict-foot{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);margin-top:-1px;padding:10px 14px;background:var(--surface)}
.verdict.has-foot{border-radius:var(--radius) var(--radius) 0 0}
.badge{display:inline-block;font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:999px}
.badge.agree{background:var(--ok-2);color:var(--ok)}
.badge.disagree{background:var(--warn-2);color:var(--warn)}
.badge.na{background:var(--line-2);color:var(--ink-2)}
.reason{margin-top:8px;white-space:pre-wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:14px}
.panel h3{margin:0 0 6px;font-size:.95rem}
.panel.warn{border-color:var(--warn);background:var(--warn-2)}
.panel.round2{border-color:var(--cobalt)}
.panel.hand{border-style:dashed}
.pre{white-space:pre-wrap}

.content{direction:ltr;text-align:left;font-family:var(--read);font-size:1.06rem;line-height:1.7}
.content .stem{font-size:1.14rem;font-weight:600;margin:18px 0 8px}
.expl{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:6px 0 4px;color:var(--ink)}
.expl.extra{border-left-color:var(--cobalt)}
.expl .lbl{display:block;font-family:var(--ui);font-size:.78rem;color:var(--ink-3);direction:rtl;text-align:right}
.opts{list-style:none;margin:14px 0 0;padding:0}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--surface)}
.opt.correct{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt .head{display:flex;gap:10px;align-items:baseline}
.opt .key{font-weight:700;min-width:1.4em}
.opt .otext{flex:1;font-weight:600}
.opt .mark{font-family:var(--ui);font-size:.8rem;font-weight:700;color:var(--ok);white-space:nowrap}
.ref{margin-top:14px;font-size:.95rem;color:var(--ink-2)}
.ref .refv{display:block;direction:ltr;text-align:left;font-family:var(--read);color:var(--ink)}

mark.ins{background:var(--stain);color:var(--stain-ink);border-radius:3px;padding:0 1px}
del.rem{color:var(--ink-3);text-decoration-thickness:2px;margin-right:.25em}

details.hist{margin-top:14px}
details.hist summary{cursor:pointer;color:var(--cobalt);font-weight:600;padding:6px 0}
.hitem{border-top:1px solid var(--line-2);padding:10px 0}
.hitem:first-child{border-top:0}

/* sticky actions */
.actions{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actions-in{max-width:720px;margin:0 auto}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{min-height:56px;font-size:1.05rem}
.approve-note{margin-bottom:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px;font-size:1.2rem}
.sheet .foot{display:flex;gap:10px;margin-top:18px}
.sheet .foot .btn{flex:1}

.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cobalt-2);color:var(--cobalt);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw}
.loading{padding:40px 0;text-align:center;color:var(--ink-3)}
</style>
</head>
<body>
<div id="app"><div class="loading">جاري التحميل…</div></div>
<noscript>هذا الموقع يحتاج تفعيل JavaScript.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* OOC Question Bank – Reviewer app (phase 3a). Talks to Supabase directly; RLS + RPCs enforce access. */
const SUPABASE_URL = 'https://djqsffknczddefukbuzu.supabase.co';
// Public (anon) key: safe to ship in a web page; every table is protected by RLS.
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcXNmZmtuY3pkZGVmdWtidXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTE0NDUsImV4cCI6MjEwNTc2NzQ0NX0.-4r_Mp6GKRLLoqotKPEDmFglsZOnyHrRpuo5j3klIcE';
const DOC_URL = 'https://claude.ai/code/artifact/aa2a7b7c-a88d-41f2-b4d9-7e79ff8c5b67';
const MSG_SOLVE = `المستند: ${DOC_URL} – هذه محادثة حل معزول. اقرأ 'معايير الشرح' و'أدوات محادثة الحل'، ثم استخدم next_unsolved وحل بـ save_solution، وللمختلف فقط reveal_source ثم set_disagreement_reason.`;
const MSG_REVISE = `المستند: ${DOC_URL} – نفّذ التعديلات المعلقة: اقرأ reviews المفتوحة، أنشئ نسخًا جديدة، اكتب resolution_note، وراجع الأسئلة التي عليها needs_consistency_check.`;
const HAND_LABEL = 'ملاحظة منقولة من ملف الأسئلة – مكتوبة بخط اليد';
const MAX_REC_SECONDS = 600;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const S = { session: null, profile: null, isAdmin: false, queue: [], notices: [], pipeline: null, bundle: null, qid: null, showExtra: false, editing: false, recovery: false };
const $app = document.getElementById('app');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function errText(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Not allowed/i.test(m)) return 'ليست لديك صلاحية على هذا السؤال.';
  if (/Invalid login credentials/i.test(m)) return 'البريد أو كلمة السر غير صحيحة.';
  if (/Email not confirmed/i.test(m)) return 'البريد لم يُؤكَّد بعد. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.';
  if (/User already registered/i.test(m)) return 'هذا البريد مسجّل بالفعل. استخدم تسجيل الدخول.';
  if (/Password should be/i.test(m)) return 'كلمة السر قصيرة: 6 أحرف على الأقل.';
  if (/revision request needs/i.test(m)) return 'طلب التعديل يحتاج نوعًا أو تعليقًا أو فويس.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'لا يوجد اتصال بالإنترنت. تأكد من الاتصال وحاول مرة أخرى.';
  return m;
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw error;
  return data;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('نُسخت الرسالة. الصقها في محادثة Claude جديدة.');
}
const seenKey = (n, kind) => `notice:${S.session?.user?.id}:${n.id}:${kind}`;
const seen = (n, kind) => { try { return localStorage.getItem(seenKey(n, kind)) === '1'; } catch { return false; } };
const markSeen = (n, kind) => { try { localStorage.setItem(seenKey(n, kind), '1'); } catch { } };
const CONF = { high: 'عالية', medium: 'متوسطة', low: 'منخفضة' };
const STATUS_AR = { extracted: 'مستخرج', solved: 'محلول', in_review: 'في المراجعة', needs_revision: 'ينتظر التعديل', revised: 'معدّل', approved: 'معتمد', archived: 'مؤرشف' };
const DECISION_AR = { approve: 'اعتمد', needs_revision: 'طلب تعديلًا', comment: 'علّق' };

/* ---------- word diff (round 2 highlighting) ---------- */
function diffHTML(oldS, newS) {
  oldS = oldS || ''; newS = newS || '';
  if (oldS === newS) return nl(newS);
  const a = oldS.split(/(\s+)/), b = newS.split(/(\s+)/);
  const n = a.length, m = b.length;
  if (n * m > 600000) return `<mark class="ins">${nl(newS)}</mark>`;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  const push = (t, s) => { const last = out[out.length - 1]; if (last && last.t === t) last.s += s; else out.push({ t, s }); };
  while (i < n && j < m) {
    if (a[i] === b[j]) { push('=', b[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { push('-', a[i]); i++; }
    else { push('+', b[j]); j++; }
  }
  while (i < n) push('-', a[i++]);
  while (j < m) push('+', b[j++]);
  return out.map(p => p.t === '=' ? nl(p.s) : p.t === '+' ? (p.s.trim() ? `<mark class="ins">${nl(p.s)}</mark>` : nl(p.s)) : (p.s.trim() ? `<del class="rem">${nl(p.s)}</del>` : '')).join('');
}

/* ---------- auth ---------- */
function renderAuth(mode = 'in', msg = '') {
  const tabs = mode === 'in' || mode === 'up';
  $app.innerHTML = `
  <main class="auth">
    <h1>مراجعة بنك الأسئلة</h1>
    <p class="lead">بوابة استشاريي OOC medical dep. لمراجعة أسئلة سكند الزمالة.</p>
    ${tabs ? `<div class="tabs" role="tablist">
      <button role="tab" aria-selected="${mode === 'in'}" data-mode="in">تسجيل الدخول</button>
      <button role="tab" aria-selected="${mode === 'up'}" data-mode="up">حساب جديد</button></div>` : ''}
    <form id="authf" novalidate>
      ${mode === 'up' ? `<label class="f" for="name">الاسم كما يظهر للفريق</label><input class="t" id="name" autocomplete="name" required>` : ''}
      ${mode !== 'reset' ? `<label class="f" for="email">البريد الإلكتروني</label><input class="t" id="email" type="email" dir="ltr" autocomplete="email" required>` : ''}
      ${mode !== 'forgot' ? `<label class="f" for="pass">${mode === 'reset' ? 'كلمة السر الجديدة' : 'كلمة السر'}</label><input class="t" id="pass" type="password" dir="ltr" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}" required minlength="6">` : ''}
      <div class="err" id="aerr" role="alert">${esc(msg)}</div>
      <button class="btn primary block" style="margin-top:14px" type="submit">${{ in: 'ادخل', up: 'أنشئ الحساب', forgot: 'أرسل رابط تغيير كلمة السر', reset: 'احفظ كلمة السر' }[mode]}</button>
    </form>
    ${mode === 'in' ? `<p><button class="linkbtn quiet" data-mode="forgot">نسيت كلمة السر؟</button></p>` : ''}
    ${mode === 'forgot' ? `<p><button class="linkbtn quiet" data-mode="in">رجوع لتسجيل الدخول</button></p>` : ''}
  </main>`;
  $app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => renderAuth(b.dataset.mode));
  document.getElementById('authf').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
    const v = id => (document.getElementById(id)?.value || '').trim();
    const err = t => { document.getElementById('aerr').textContent = t; btn.disabled = false; };
    try {
      if (mode === 'in') {
        const { error } = await sb.auth.signInWithPassword({ email: v('email'), password: document.getElementById('pass').value });
        if (error) throw error;
      } else if (mode === 'up') {
        if (!v('name')) return err('اكتب اسمك.');
        const { data, error } = await sb.auth.signUp({ email: v('email'), password: document.getElementById('pass').value,
          options: { data: { display_name: v('name') }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!data.session) return renderAuth('in', 'أُرسلت رسالة تأكيد إلى بريدك. افتحها ثم سجّل الدخول.');
      } else if (mode === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(v('email'), { redirectTo: location.origin + location.pathname });
        if (error) throw error;
        return renderAuth('in', 'أُرسل رابط تغيير كلمة السر إلى بريدك.');
      } else if (mode === 'reset') {
        const { error } = await sb.auth.updateUser({ password: document.getElementById('pass').value });
        if (error) throw error;
        S.recovery = false; toast('حُفظت كلمة السر الجديدة.');
        const { data: { session } } = await sb.auth.getSession(); await onSession(session);
      }
    } catch (e) { err(errText(e)); }
  };
}

function renderPending() {
  $app.innerHTML = `
  <main class="auth">

async function solverCall(action, extra = {}) {

  if (error) {
    let d = null; try { d = await error.context.json(); } catch { }
    const e = new Error(d?.error || error.message); e.detail = d; throw e;

}
function solverErr(e) {
  const d = e.detail || {}, c = d.error || e.message;
  if (c === 'no_key') return 'لا يوجد مفتاح API بعد.';
  if (c === 'run_active') return 'توجد تشغيلة جارية بالفعل.';
  if (c === 'trial_waiting_approval') return 'التجربة انتهت وتنتظر قرارك قبل أي تشغيلة جديدة.';
  if (c === 'nothing_to_solve') return 'لا توجد أسئلة تنتظر الحل.';
  if (c === 'no_trial_yet') return 'لم تنجح أي تجربة بعد.';
  if (c === 'over_budget') return `التكلفة المتوقعة ${usd(d.estimate)} أعلى من الحد الأقصى للتشغيلة ${usd(d.cap)}. قلّل عدد الأسئلة.`;
  if (c === 'anthropic_error') {
    if (d.status === 401) return 'مفتاح API غير صحيح. أنشئ مفتاحًا جديدًا وضعه مكان القديم في Supabase.';
    if (/credit balance/i.test(d.detail || '')) return 'رصيد حساب Anthropic غير كافٍ. اشحن الرصيد ثم حاول مرة أخرى.';
    return `رد Anthropic بخطأ (${d.status}): ${String(d.detail || '').slice(0, 160)}`;
  }
  if (c === 'admins_only') return 'للمالك والأدمن فقط.';
  return errText(e);
}
function solverSummary(r) {
  const c = r.counts || {}, n = (c.agree || 0) + (c.disagree || 0) + (c.not_applicable || 0);
  return `حُل ${n} من ${r.requested}: اتفاق ${c.agree || 0}، اختلاف ${c.disagree || 0}` +
    (c.second_differs ? ` (${c.second_differs} اختلف فيها الرأي الثاني، فثقتها منخفضة)` : '') +

    `. التكلفة الفعلية ${usd(r.cost_usd)}${n ? ` (${usd(r.cost_usd / n)} للسؤال)` : ''}.`;

/* ---------- decisions ---------- */
async function afterDecision(qid, msg) {

  location.hash = next ? `#q/${next.qid}` : '';
}
async function doApprove(note) {

/* ---------- revision sheet + voice ---------- */
const V = { rec: null, stream: null, chunks: [], blob: null, mime: '', sr: null, t0: 0, timer: null, lang: 'ar-EG', on: false };

}
function openRevision(pre = {}) {

    <label class="f" for="rv-trans">نص الفويس ${canSR ? '(يُكتب تلقائيًا أثناء التسجيل، صحّحه قبل الإرسال)' : '(اكتبه أو الصقه)'}</label>

    <div class="err" id="rv-err" role="alert"></div>
    <div class="foot"><button class="btn primary" id="rv-send">أرسل طلب التعديل</button><button class="btn" id="rv-cancel">إلغاء</button></div>
  </div>`;
  document.body.appendChild(sc);
  V.blob = null; V.chunks = [];
  const close = () => { stopRec(); sc.remove(); };

  const recBtn = sc.querySelector('#rec-btn');
  if (recBtn) recBtn.onclick = () => V.on ? stopRec() : startRec(sc);

    if (V.blob && !trans && !comment && !type) { err.textContent = 'Claude لا يسمع الصوت: اكتب نص الفويس أو تعليقًا قصيرًا.'; return; }
    btn.disabled = true; err.textContent = '';

}
async function startRec(sc) {
  const state = sc.querySelector('#rec-state'), btn = sc.querySelector('#rec-btn'), trans = sc.querySelector('#rv-trans');
  try {
    V.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch { state.textContent = 'لم يُسمح باستخدام الميكروفون. اسمح به من إعدادات المتصفح، أو اكتب ملاحظتك.'; return; }
  V.mime = pickMime(); V.chunks = []; V.blob = null;
  V.rec = new MediaRecorder(V.stream, V.mime ? { mimeType: V.mime, audioBitsPerSecond: 20000 } : { audioBitsPerSecond: 20000 });
  V.mime = V.rec.mimeType || V.mime || 'audio/webm';
  V.rec.ondataavailable = e => { if (e.data && e.data.size) V.chunks.push(e.data); };
  V.rec.onstop = () => {
    V.blob = new Blob(V.chunks, { type: V.mime.split(';')[0] });
    const play = sc.querySelector('#rec-play'); if (play) { play.src = URL.createObjectURL(V.blob); play.classList.remove('hidden'); }
    sc.querySelector('#rec-del')?.classList.remove('hidden');
    state.textContent = `تسجيل جاهز (${Math.round(V.blob.size / 1024)} KB)`;
  };
  V.rec.start(1000); V.on = true; V.t0 = Date.now();
  btn.textContent = '■ إيقاف';
  V.timer = setInterval(() => {
    const s = Math.floor((Date.now() - V.t0) / 1000);
    state.innerHTML = `<span class="dot" style="display:inline-block"></span> ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (s >= MAX_REC_SECONDS) stopRec();
  }, 500);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const startSR = () => {
      const r = new SR(); r.lang = V.lang; r.continuous = true; r.interimResults = false;
      r.onresult = ev => { for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) trans.value = (trans.value ? trans.value.trimEnd() + ' ' : '') + ev.results[i][0].transcript.trim(); };
      r.onerror = () => { };
      r.onend = () => { if (V.on) { try { startSR(); } catch { } } };

    };

  }

}

  if (!V.on) return;

      return n;
    });
    if (optChanged) ch.options = opts;
    if (!Object.keys(ch).length) { err.textContent = 'لم يتغير شيء.'; return; }
    const btn = sc.querySelector('#qe-save'); btn.disabled = true;
    try {
      await rpc('quick_edit', { p_qid: S.qid, p_changes: ch, p_note: why });
      sc.remove(); toast('حُفظ التعديل. السؤال الآن "معدّل" وينتظر الاعتماد.');
      await loadQueue(); await openQuestion(S.qid);
    } catch (e) { btn.disabled = false; err.textContent = errText(e); }
  };
}

/* ---------- boot ---------- */
// Supabase fires INITIAL_SESSION on load, then SIGNED_IN / SIGNED_OUT / PASSWORD_RECOVERY.
// Work is deferred with setTimeout so no Supabase call runs inside the auth callback.
let currentUser = null;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { S.recovery = true; S.session = session; setTimeout(() => renderAuth('reset'), 0); return; }
  if (event === 'SIGNED_OUT') { currentUser = null; S.session = null; S.profile = null; setTimeout(() => renderAuth('in'), 0); return; }
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
    const uid = session?.user?.id || null;
    if (event === 'SIGNED_IN' && uid && uid === currentUser) { S.session = session; return; } // token refresh / tab focus
    currentUser = uid;
    setTimeout(() => onSession(session), 0);
  }
  if (event === 'TOKEN_REFRESHED') S.session = session;
});
</script>
